}

.price-table tbody tr{
  height:28px;
  max-height:28px
}

.price-table tbody td{
  height:28px;
  max-height:28px;
  padding:3px 6px!important;
  overflow:hidden;
  white-space:nowrap;
  vertical-align:middle;
  box-sizing:border-box
}

.price-table tbody td:focus-within{
  height:28px;
  max-height:28px;
  padding:3px 6px!important
}

.price-table .cell-field,.price-table .cell-input,.price-table .cell-select{
  width:100%;
  max-width:100%;
  height:24px!important;
  min-height:24px;
  max-height:24px;
  padding:2px 4px!important;
  font-size:12px!important;
  line-height:1.2;
  border:1px solid transparent;
  border-radius:4px;
  box-sizing:border-box;
  outline:none;
  background:transparent;
  color:#000000;
  transform:none!important;
  position:static;
  z-index:auto;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  display:block
}

.price-table .cell-field{
  cursor:text;
  text-align:left
}

.price-table .cell-field:hover{
  background:rgba(0,0,0,.05)
}

.price-table .cell-input{
  background:var(--surface)
}

.price-table .cell-field:focus,.price-table .cell-input:focus,.price-table .cell-select:focus{
  border-color:#999!important;
  outline:none;
  box-shadow:none;
  transform:none!important;
  width:100%;
  max-width:100%;
  height:24px!important;
  padding:2px 4px!important;
  font-size:12px!important;
  line-height:1.2
}

.price-table .cell-select{
  -webkit-appearance:auto;
     -moz-appearance:auto;
          appearance:auto;
  cursor:pointer
}

.price-table .cell-action{
  width:24px;
  height:24px;
  min-height:24px;
  max-height:24px;
  padding:0;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  box-sizing:border-box
}

/* Column-width fix: fixed layout is driven by <colgroup> in App.tsx.
   Item Name (300px) and Available (170px) are prioritised; each
   category sub-column is 62px. Item names are never ellipsised. */

.price-table thead th{
  overflow:hidden;
  box-sizing:border-box
}

.price-table tbody td.item-name-cell{
  white-space:nowrap;
  overflow:hidden
}

.price-table tbody td.item-name-cell .cell-field,.price-table tbody td.item-name-cell .cell-input{
  text-overflow:clip;
  white-space:nowrap
}

.price-table tbody td.avail-cell{
  padding:3px 4px!important
}

.price-table tbody td.avail-cell .cell-select{
  min-width:0;
  white-space:nowrap
}

.price-table tbody td.cat-cell{
  padding:3px 2px!important
}

.price-table tbody td.base-cell{
  padding:3px 3px!important
}

.table-wrap::-webkit-scrollbar{
  height:10px;
  width:10px
}

.table-wrap::-webkit-scrollbar-thumb{
  background:#c9c4b6;
  border-radius:99px
}

@media print{
  .no-print{
    display:none!important
  }

  body{
    background:white
  }

  .print-shell{
    padding:0!important
  }
}

@media (min-width: 640px) {
  .sm\:flex-none {
    flex: none;
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:items-center {
    align-items: center;
  }

  .sm\:p-4 {
    padding: 1rem;
  }

  .sm\:p-5 {
    padding: 1.25rem;
  }

  .sm\:p-8 {
    padding: 2rem;
  }

  .sm\:px-4 {
    padding-left: 1rem;
    padding-right: 1rem;
  }

  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:pt-6 {
    padding-top: 1.5rem;
  }

  .sm\:text-\[15px\] {
    font-size: 15px;
  }

  .sm\:text-\[44px\] {
    font-size: 44px;
  }
}

@media (min-width: 1024px) {
  .lg\:flex-row {
    flex-direction: row;
  }
}

<style id="order-view-style">
#order-view{position:fixed;inset:0;z-index:10000;background:#e8e8e8;display:none;overflow:auto}
#order-view.open{display:block}
#order-view .phone{max-width:430px;margin:0 auto;background:#FFF8E7;min-height:100dvh;padding-bottom:80px;position:relative}
#order-view .otop{position:sticky;top:0;z-index:5;background:#111;color:#fff;padding:10px}
#order-view .otop h1{margin:0;font-size:17px}#order-view .otop p{margin:2px 0 0;font-size:11px;opacity:.75}
#order-view .obadge{display:inline-block;background:#25D366;color:#111;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:900;margin-top:6px}
#order-view .otabs{display:flex;gap:6px;padding:8px 10px 0;position:sticky;top:108px;z-index:4;background:#FFF8E7}#order-view .otabs button{flex:1;border:2px solid #111;border-radius:10px;padding:11px 4px;font-size:14px;font-weight:900;cursor:pointer;background:#fff}#order-view .otabs button.on{background:#111;color:#fff}
#order-view .osearch{display:flex;gap:6px;padding:8px 10px 0}#order-view .osearch input{flex:1;padding:9px 10px;border:1.5px solid #111;border-radius:10px;font-size:14px;font-weight:700;background:#fff}#order-view .osearch select{padding:9px 6px;border:1.5px solid #111;border-radius:10px;font-weight:800;font-size:12px;background:#fff}
#order-view .ohint{padding:6px 10px 0;font-size:11px;color:#666}
#order-view .olist{padding:6px 8px 8px}
#order-view .orow{background:#fff;border:1px solid #e2e2e2;border-radius:10px;padding:7px 8px;margin-bottom:5px}
#order-view .or1{display:flex;gap:6px}.orow .oname{flex:1;font-size:13.5px;font-weight:800;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#order-view .oprice{text-align:right;white-space:nowrap}#order-view .oprice b{font-size:14px}#order-view .oprice small{display:block;font-size:10.5px;color:#666}
#order-view .or2{display:flex;gap:5px;align-items:center;margin-top:6px}#order-view .ocq{font-size:11px;color:#555;white-space:nowrap}
#order-view .oseg{display:flex;border:1.5px solid #111;border-radius:8px;overflow:hidden}#order-view .oseg button{border:0;background:#fff;padding:6px 8px;font-size:11px;font-weight:900;cursor:pointer}#order-view .oseg button.on{background:#111;color:#fff}
#order-view .ostep{display:flex;align-items:center;border:1.5px solid #111;border-radius:8px;overflow:hidden;margin-left:auto}#order-view .ostep button{border:0;background:#eee;width:30px;height:30px;font-size:18px;font-weight:900;cursor:pointer}#order-view .ostep input{width:38px;border:0;text-align:center;font-size:15px;font-weight:900;height:30px}
#order-view .oadd{background:#25D366;border:0;border-radius:8px;padding:0 12px;height:32px;font-weight:900;font-size:12px;cursor:pointer;white-space:nowrap}#order-view .oadd.incart{background:#111;color:#fff}
#order-view .olt{font-size:11px;font-weight:800;color:#0a7a33;margin-top:4px;text-align:right}
#order-view .obar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;background:#fff;border-top:2px solid #111;padding:8px 10px;z-index:6}
#order-view .obarTop{display:flex;justify-content:space-between;align-items:center}#order-view .obarTop b{font-size:15px}
#order-view .oview{background:#111;color:#fff;border:0;border-radius:9px;padding:9px 14px;font-weight:900;font-size:13px;cursor:pointer}
#order-view .osheet{display:none;background:#fff;border-top:2px solid #111;max-height:62dvh;overflow:auto;padding:10px}#order-view .osheet.open{display:block}
#order-view .osheet input{width:100%;padding:10px;border:1.5px solid #ccc;border-radius:9px;font-weight:700;margin-bottom:6px;font-size:14px}
#order-view .ocitem{display:flex;gap:6px;align-items:center;padding:7px 0;border-bottom:1px dashed #ddd;font-size:13px}#order-view .ocitem .n{flex:1}#order-view .ocitem .n b{font-size:12.5px}#order-view .ocitem .n small{color:#666;font-size:11px}
#order-view .omini{display:flex;align-items:center;gap:4px}#order-view .omini button{width:26px;height:26px;border:1px solid #111;border-radius:7px;background:#fff;font-weight:900}#order-view .omini b{min-width:22px;text-align:center}
#order-view .orm{border:0;background:#ffe1e1;border-radius:7px;padding:6px 8px;font-weight:900}

function slugify(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"") || "customer"; }
function catNameFromPreviewBtn(btn){
  var txt=(btn.innerText||"").replace(/\r/g,"");
  var m=txt.match(/WHATSAPP\s*[—\-–]\s*([^\n]+)/i);
  if(m) return m[1].trim();
  var lines=txt.split("\n").map(function(x){return x.trim()}).filter(Boolean);
  return lines[0]||"";

    try{
      var btn=document.querySelector('nav button[aria-pressed="true"]');
      if(btn && /NON\s*FOOD/i.test(btn.textContent||'')) return 'nonfood';
      if(btn && /FOOD/i.test(btn.textContent||'')) return 'food';
    }catch(e){}
    try{ if((document.body.innerText||'').indexOf('Non Food Price List')>=0) return 'nonfood'; }catch(e){}
    return 'food';
  }
  function pill(msg,color){
    try{
      var p=document.querySelector('div[style*="position:fixed"]');
      if(p){ p.textContent=msg; if(color) p.style.background=color; }
    }catch(e){}
  }
  function dbGet(){
    try{ if(window.firebase && firebase.apps && firebase.apps.length) return firebase.firestore(); }catch(e){}
    return null;
  }
  function localKey(tab){ return 'csvFullFix_'+tab; }
  function saveCsv(tab, csv, source){
    if(!csv) return;
    if(lastSavedCsv[tab]===csv) return;
    lastSavedCsv[tab]=csv;
    try{ localStorage.setItem(localKey(tab), JSON.stringify({csv:csv, at:Date.now(), source:source||''})); }catch(e){}
    var db=dbGet();
    if(db){
      var obj={updatedAt:Date.now(), updatedAtText:new Date().toLocaleString()};
      obj[tab==='food'?'foodCsv':'nonfoodCsv']=csv;
      obj[tab==='food'?'foodAt':'nonfoodAt']=Date.now();
      db.collection('pricelist').doc('csv-full').set(obj,{merge:true}).then(function(){
        pill('\u2601\uFE0F CSV saved to Cloud \u2713 '+(tab==='food'?'FOOD':'NON FOOD'),'#1a7a2e');
      }).catch(function(){ pill('\u2601\uFE0F CSV saved locally \u2014 Cloud save failed','#b8860b'); });
    } else {
      pill('\u2601\uFE0F CSV saved locally \u2014 Cloud not ready','#b8860b');
    }
  }
  function clearCsv(tab){
    lastSavedCsv[tab]=''; restored[tab]=true;
    try{ localStorage.removeItem(localKey(tab)); }catch(e){}
    var db=dbGet(); if(db){ var o={}; o[tab==='food'?'foodCsv':'nonfoodCsv']=''; db.collection('pricelist').doc('csv-full').set(o,{merge:true}).catch(function(){}); }
  }
  // ---- 1) Capture every real CSV upload, save the RAW file (100% fidelity) ----
  document.addEventListener('change', function(e){
    var inp=e.target;
    if(!inp || inp.tagName!=='INPUT' || inp.type!=='file') return;
    if(restoring) return;
    var f=inp.files && inp.files[0]; if(!f) return;
    var tab=tabNow();
    var r=new FileReader();
    r.onload=function(){ saveCsv(tab, String(r.result||''), 'upload'); };
    r.readAsText(f);
  }, true);
  // ---- 2) Also capture manual cell edits: rebuild a full CSV from the visible table ----
  function scrapeFullCsv(){
    try{
      var ths=[].slice.call(document.querySelectorAll('table.price-table thead th'));
      var cats=[];
      ths.forEach(function(th){
        var txt=(th.innerText||'').replace(/\s+/g,' ').trim();
        if(/PROFIT$/i.test(txt)){ var nm=txt.replace(/\s+PROFIT$/i,'').trim(); if(nm) cats.push(nm); }
      });
      if(!cats.length) return null;
      var rows=[].slice.call(document.querySelectorAll('table.price-table tbody tr'));
      var out=[];
      // Header: use scraped category names; custom columns (after last category) taken from thead
      var customLabels=[];
      // thead ths after the last PROFIT/PRICE/RATE group are custom + action; action th is usually empty/last
      var lastRateIdx=-1; ths.forEach(function(th,i){ if(/RATE$/i.test((th.innerText||'').replace(/\s+/g,' ').trim())) lastRateIdx=i; });
      if(lastRateIdx>=0){
        for(var i=lastRateIdx+1;i<ths.length;i++){
          var lab=(ths[i].innerText||'').replace(/\s+/g,' ').trim();
          if(lab && !/^\s*$/.test(lab) && lab.toUpperCase().indexOf('DELETE')<0) customLabels.push(lab);
        }
      }
      var header=['ITEM NAME','AVAILABILITY','PURCHASE RATE','CASE QTY'];
      cats.forEach(function(c){ header.push(c+' PROFIT', c+' PRICE', c+' RATE'); });
      customLabels.forEach(function(c){ header.push(c); });
      out.push(header);
      rows.forEach(function(tr){
        var cells=tr.querySelectorAll('td'); if(cells.length<4) return;
        var name=(cells[0].innerText||'').trim(); if(!name) return;
        if(name.indexOf('No ')===0 && name.indexOf('items yet')>=0) return;
        var availCell=cells[1]; var sel=availCell.querySelector('select');
        var avail=sel?sel.value:(availCell.innerText||'').trim();
        var purchase=(cells[2].innerText||'').trim();
        var caseQty=(cells[3].innerText||'').trim();
        var row=[name, avail, purchase, caseQty];
        cats.forEach(function(c,k){
          row.push((cells[4+k*3]?cells[4+k*3].innerText:'').trim());
          row.push((cells[5+k*3]?cells[5+k*3].innerText:'').trim());
          row.push((cells[6+k*3]?cells[6+k*3].innerText:'').trim());
        });
        var base=4+cats.length*3;
        for(var j=0;j<customLabels.length;j++){ row.push((cells[base+j]?cells[base+j].innerText:'').trim()); }
        out.push(row);
      });
      if(out.length<2) return null;
      return out.map(function(r){ return r.map(function(v){ v=String(v==null?'':v); if(/[",\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"'; return v; }).join(','); }).join('\n');
    }catch(e){ return null; }
  }
  function scheduleScrapeSave(){
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer=setTimeout(function(){
      if(restoring) return;
      var csv=scrapeFullCsv(); if(!csv) return;
      // Only overwrite the stored CSV if it came from the same tab's table and differs.
      // This keeps manual edits (price/purchase/profit/availability) persisted too.
      var tab=tabNow(); saveCsv(tab, csv, 'edit-scrape');
    }, 4000);
  }
  document.addEventListener('input', function(e){ if(e.target && e.target.closest && e.target.closest('table.price-table')) scheduleScrapeSave(); }, true);
  document.addEventListener('change', function(e){ if(e.target && e.target.closest && e.target.closest('table.price-table')) scheduleScrapeSave(); }, true);
  // ---- 3) Reset Data must clear the cloud CSV too, otherwise it comes back ----
  document.addEventListener('click', function(e){
    var b=e.target && e.target.closest ? e.target.closest('button') : null;
    if(!b) return;
    var txt=(b.textContent||'').trim();
    if(txt==='Yes, remove'){
      // Only when the dialog is the Reset dialog (not Delete item/category)
      var dlg=document.body.innerText||'';
      if(dlg.indexOf('Reset to original list?')>=0){ setTimeout(function(){ clearCsv(tabNow()); pill('\u2601\uFE0F Reset \u2014 cloud CSV cleared','#1a7a2e'); }, 300); }
    }
  }, true);
  // ---- 4) Restore: re-feed saved CSV through the app's own Upload CSV input ----
  var cloudCsv={food:'', nonfood:''};
  function loadCloud(){
    var db=dbGet(); if(!db) return;
    db.collection('pricelist').doc('csv-full').get().then(function(doc){
      if(doc.exists){ var d=doc.data()||{}; if(d.foodCsv) cloudCsv.food=d.foodCsv; if(d.nonfoodCsv) cloudCsv.nonfood=d.nonfoodCsv;
        if(cloudCsv.food) lastSavedCsv.food=cloudCsv.food;
        if(cloudCsv.nonfood) lastSavedCsv.nonfood=cloudCsv.nonfood;
      }
    }).catch(function(){});
    // Local backup fills gaps if cloud is empty / offline
    try{
      ['food','nonfood'].forEach(function(tab){
        var raw=localStorage.getItem(localKey(tab));
        if(raw){ var o=JSON.parse(raw); if(o && o.csv && !cloudCsv[tab]){ cloudCsv[tab]=o.csv; lastSavedCsv[tab]=o.csv; } }
      });
    }catch(e){}
  }
  function findFileInput(){
    var inputs=document.querySelectorAll('input[type="file"][accept*="csv"]');
    return inputs.length?inputs[0]:null;
  }
  function clickYesReplace(){
    var tries=0;
    var iv=setInterval(function(){
      tries++;
      var btns=[].slice.call(document.querySelectorAll('button'));
      var yes=btns.find(function(b){ return (b.textContent||'').trim()==='Yes, replace'; });
      if(yes){ clearInterval(iv); yes.click(); pill('\u2601\uFE0F Restored saved CSV \u2713',' #1a7a2e'.trim()); return; }
      if(tries>40) clearInterval(iv);
    }, 250);
  }
  function restoreTab(tab){
    if(restored[tab]) return;
    var csv=cloudCsv[tab]; if(!csv) return;
    var inp=findFileInput(); if(!inp) return;
    // Don't restore over a list the user already changed this session (e.g. just uploaded)
    restored[tab]=true;
    restoring=true;
    try{
      var file=new File([csv], tab==='food'?'price-list.csv':'non-food-price-list.csv', {type:'text/csv'});
      var dt=new DataTransfer(); dt.items.add(file);
      inp.files=dt.files;
      inp.dispatchEvent(new Event('change',{bubbles:true}));
      inp.dispatchEvent(new Event('input',{bubbles:true}));
      pill('\u2601\uFE0F Restoring saved CSV\u2026','#111');
      clickYesReplace();
    }catch(e){ restoring=false; }
    setTimeout(function(){ restoring=false; }, 3000);
  }
  // Wait for login + Firebase, then restore current tab; watch tab switches for the other tab
  var started=false;
  function tick(){
    if(!started && dbGet()){ started=true; loadCloud(); }
    if(started && findFileInput()){
      var t=tabNow();
      if(cloudCsv[t]) restoreTab(t);
    }
  }
  setInterval(tick, 1500);
  // Also re-check cloud a little later (Firestore may init after this script)
  setTimeout(loadCloud, 5000);
  setTimeout(loadCloud, 12000);
})();
</script>
